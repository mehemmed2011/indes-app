<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="../../../assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../../styles/global.css">
    <link rel="stylesheet" href="./searchPanel.css">
    <title>Client Search Panel - Filmalisa</title>
</head>
<body>
    <div class="search-container">
        <div class="movie-header">
            <a class="logo-link" href="../../../index.html"> <img class="logo-img" src="../../../assets/icons/logo.svg" alt=""></a>
            <ul class="movie-header-list">
                <li class="list-item"><a class="list-link" href="../home/home.html"><img src="../../../assets/icons/home-icon.svg" alt=""></a></li>
                <li class="list-item active"><a class="list-link" href="./searchPanel.html"><img src="../../../assets/icons/search-icon.svg" alt=""></a></li>
                <li class="list-item"><a class="list-link" href="../account/account.html"><img src="../../../assets/icons/account-icon.svg" alt=""></a></li>
                <li class="list-item"><a class="list-link" href="../favorite/favorite.html"><img src="../../../assets/icons/favorite-icon.svg" alt=""></a></li>
            </ul>
        </div>

        <section class="search-movies-section">
            <div class="search-content">
            <h1 class="search-movies-title"> Search result<span><img src="../../../assets/icons/similar-arrow-icon.svg" alt=""></span></h1>
            <div class="search-field">
                <input id="search-input"  type="text" placeholder="Search...">
                <img class="add-search-icon" src="../../../assets/icons/add-search-icon.svg" alt="">
            </div>
        </div>

            <div class="search-movies-cards">
                 <!-- Search movies cards will be displayed here -->
           </div>
           <p id="no-result-message" style="color: white; text-align: center; display: none;">No movies found</p>
          </section>
    </div>

    
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="../../../assets/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="./searchPanel.js"></script>
</body>
</html>
